# The `gate` check the paiml org ruleset requires on main.
#
# Every example and the wine-pipeline must build, pass clippy, and pass their
# tests, including the `serve` route tests Module 4's graded project grades
# against. All jobs run on GitHub-hosted ubuntu-24.04 with a pinned toolchain
# (rust-toolchain.toml). `gate` needs every other job.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install system packages (README, Linux)
        run: sudo apt-get update && sudo apt-get install -y build-essential curl
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: build-${{ runner.os }}-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  gate:
    name: gate
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    needs: [build]
    steps:
      - name: All jobs must succeed
        run: |
          test "${{ needs.build.result }}" = success
